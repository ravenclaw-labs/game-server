[URL]
; Your server name
ServerName=My Icarus Server

; The description shown in server lists
ServerDescription=Icarus Dedicated Server

; Public or Private
bIsLanMatch=False
bIsOnline=True
bUsesSteam=True

[ServerSettings]
; The name of the map folder (will create automatically)
MapName=Icarus

; The server password (leave blank for no password)
ServerPassword=

; The admin password
AdminPassword=

; Max players
MaxPlayers=6

; Player can join while server is loading
bAllowJoinInProgress=True

; Enable PVP
bAllowPvP=False

; Friendly fire
bAllowFriendlyFire=False

; Allow building
bAllowBuilding=True

; Allow flying (debug)
bAllowFlying=False

; Kick idle players
bKickIdlePlayers=True
IdleTimeout=300

; Allow server to be listed on Steam
bPublicServer=True

[Network]
; Server port
Port=17777

; Query port
QueryPort=27015

; The server's network bandwidth
NetServerMaxTickRate=30
MaxClientRate=1000000

[Steam]
; Steam API key (required for server listing)
SteamServerAuthKey=

[Logging]
; Log file path
LogFile=Saved/Logs/IcarusServer.log

; Enable verbose logging
bVerboseLogging=False
