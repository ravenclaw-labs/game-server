[/Script/ConanSandbox.SystemSettings]

; ===============================
; 🔐 ACESSO E SEGURANÇA
; ===============================

ServerPassword=2810
; Senha para entrar no servidor (deixe vazio para público)

AdminPassword=SENHA_ADMIN
; Senha de admin (usada no painel in-game)

; ===============================
; 🌍 IDENTIDADE DO SERVIDOR
; ===============================

ServerName=Ordem dos Sobreviventes
; Nome exibido na lista de servidores

ServerRegion=Brazil
; Região exibida (Brazil, SouthAmerica, etc)

ServerDescription=Servidor privado para amigos
; Descrição do servidor

MaxPlayers=10
; Número máximo de jogadores simultâneos

; ===============================
; ⚔️ PVP / PVE
; ===============================

PVPEnabled=False
; True = PVP ligado | False = PVE

RestrictPVPBuildingDamageTime=False
; Se True, dano a construções só em horários específicos

PVPBuildingDamageTimeWeekdayStart=0
PVPBuildingDamageTimeWeekdayEnd=0
PVPBuildingDamageTimeWeekendStart=0
PVPBuildingDamageTimeWeekendEnd=0
; Horários de raid (0–24). Só usado se RestrictPVPBuildingDamageTime=True

; ===============================
; 🏠 BASE / CONSTRUÇÃO
; ===============================

MaxNudity=2
; 0 = None | 1 = Partial | 2 = Full

CanDamagePlayerOwnedStructures=True
; Permite destruir construções de jogadores

EnableSandStorm=True
; Ativa tempestade de areia

DecayCleanupTimeMultiplier=1.0
; Multiplicador de decay (bases abandonadas)

; ===============================
; ⏱️ MULTIPLICADORES (QUALIDADE DE VIDA)
; ===============================

XPMultiplier=1.5
; XP geral

PlayerXPMultiplier=1.5
; XP do jogador

CraftingSpeedMultiplier=1.5
; Velocidade de crafting

HarvestAmountMultiplier=2.0
; Quantidade coletada

HarvestHealthMultiplier=1.0
; Durabilidade dos nós de coleta

PlayerEncumbranceMultiplier=0.8
; Peso carregado (menor = carrega mais)

; ===============================
; ❤️ COMBATE / SOBREVIVÊNCIA
; ===============================

PlayerDamageMultiplier=1.0
; Dano causado pelo jogador

NPCDamageMultiplier=1.0
; Dano causado por NPCs

PlayerDamageTakenMultiplier=1.0
; Dano recebido pelo jogador

NPCHealthMultiplier=1.0
; Vida dos NPCs

PlayerHealthMultiplier=1.0
; Vida do jogador

PlayerStaminaMultiplier=1.2
; Estamina do jogador

; ===============================
; 🕒 CICLO DE TEMPO
; ===============================

DayCycleSpeedScale=0.5
; Velocidade do ciclo dia/noite (menor = dias mais longos)

DayTimeSpeedScale=0.5
; Velocidade do dia

NightTimeSpeedScale=1.0
; Velocidade da noite

; ===============================
; 🧟 NPCs / PURGE
; ===============================

EnablePurge=True
; Ativa o Purge

PurgeLevel=4
; Nível do Purge (1–6)

PurgeDuration=30
; Duração do Purge em minutos

PurgePreparationTime=10
; Tempo de aviso antes do Purge

; ===============================
; 🧱 BUILD LIMITS
; ===============================

BuildingDamageMultiplier=1.0
; Dano às construções

BuildingHealthMultiplier=1.0
; Vida das construções

; ===============================
; 🧠 IA / PERFORMANCE
; ===============================

NPCRespawnMultiplier=1.0
; Tempo de respawn dos NPCs

ThrallWakeUpTime=5.0
; Tempo pra thralls acordarem

; ===============================
; 🔧 SERVIDOR / TÉCNICO
; ===============================

IsVACEnabled=True
; Anti-cheat da Steam

EnableBattleEye=True
; BattleEye (recomendado ON)

LogLevel=Information
; Nível de log (Verbose, Information, Warning)

; ===============================
; 🧩 MODS (se usar)
; ===============================

; Mods devem ser definidos via variável de ambiente
; CONANEXILES_MODS no docker-compose / .env

