;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; SCUM ServerSettings.ini
;; Arquivo principal de configuração do servidor
;; Comentado para facilitar ajustes e testes
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[ServerSettings]

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; IDENTIDADE DO SERVIDOR
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; Nome do servidor (aparece na lista)
; Texto livre
ServerName=Zero Zone

; Descrição do servidor
; Texto livre
ServerDescription=Servidor de SCUM entre amigos

; Número máximo de jogadores
; Escala prática: 1 ~ 128 (acima disso começa a ficar instável)
MaxPlayers=64

; Senha do servidor (vazio = público)
ServerPassword=

; Senha de admin (OBRIGATÓRIO alterar)
AdminPassword=PASSWORD


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; PORTAS
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; Porta principal do jogo
; Padrão: 7042
Port=7042

; Porta de query (Steam server browser)
; Padrão: 27015
QueryPort=27015

; Porta RCON
; Padrão: 27020
RconPort=27020


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; SAVE / SEGURANÇA
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; Intervalo de salvamento automático (em segundos)
; Mínimo recomendado: 60
; Padrão: 300 (5 min)
SaveInterval=300

; Anti-cheat Battleye
; true = ligado | false = desligado
EnableBattleye=true


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; VISÃO / INTERFACE
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; Permitir terceira pessoa
AllowThirdPerson=true

; Permitir primeira pessoa
AllowFirstPerson=true

; Mira na tela (crosshair)
AllowCrosshair=true

; Tela de mapa (TAB)
AllowMapScreen=true

; Bússola
AllowCompass=true


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; MULTIPLICADORES GERAIS
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; Multiplicador global de loot
; Escala prática:
; 0.0 = nenhum loot
; 1.0 = padrão
; 2.0 ~ 5.0 = muito loot
; >5.0 = exagerado / quebra economia
LootMultiplier=1.0

; Multiplicador de dano geral
; 0.5 = metade do dano
; 1.0 = padrão
; 2.0 = dano dobrado
DamageMultiplier=1.0

; Consumo de stamina
; 0.5 = menos cansaço
; 1.0 = padrão
; 2.0 = cansaço rápido
StaminaDrainMultiplier=1.0

; Ganho de skills
; 0.1 = muito lento
; 1.0 = padrão
; 5.0 = up rápido
SkillGainMultiplier=1.0

; Ganho de Fame Points
; 0.5 = difícil
; 1.0 = padrão
; 3.0 = fácil
FameGainMultiplier=1.0


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; ZUMBIS (PUPPETS)
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; Quantidade máxima global de zumbis
; Escala prática:
; 0 = desativa zumbis
; 64 = padrão
; 100+ = pesado para CPU
MaxAllowedZombies=64

; Vida dos zumbis
; 0.5 = fracos
; 1.0 = padrão
; 2.0 = tanques
ZombieHealthMultiplier=1.0

; Dano dos zumbis
; 0.5 = fraco
; 1.0 = padrão
; 2.0 = muito letal
ZombieDamageMultiplier=1.0

; Spawn de zumbis
; 0.0 = não spawna
; 1.0 = padrão
; 3.0 = infestação
ZombieSpawnMultiplier=1.0


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; ANIMAIS
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; Spawn de animais
; 0.0 = nenhum
; 1.0 = padrão
; 3.0 = muitos animais
AnimalSpawnMultiplier=1.0

; Vida dos animais
; 1.0 = padrão
AnimalHealthMultiplier=1.0

; Dano dos animais
; 1.0 = padrão
AnimalDamageMultiplier=1.0


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; VEÍCULOS
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; Spawn de veículos
; 0.0 = nenhum veículo
; 1.0 = padrão
; 2.0 ~ 3.0 = fácil encontrar
VehicleSpawnMultiplier=1.0

; Dano recebido pelos veículos
; 0.5 = mais resistentes
; 1.0 = padrão
; 2.0 = frágeis
VehicleDamageMultiplier=1.0

; Consumo de combustível
; 0.5 = econômico
; 1.0 = padrão
; 2.0 = gastão
VehicleFuelConsumptionMultiplier=1.0


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; BASE BUILDING
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; Permitir construção de base
AllowBaseBuilding=true

; Restrição de construção
; 0 = nenhuma
; 1+ = regras mais rígidas
BaseBuildingRestriction=0

; Dano às bases
; 0.0 = invulnerável
; 1.0 = padrão
; 2.0 = frágil
BaseDamageMultiplier=1.0

; Proteção de raid por horário
RaidProtection=true

; Horário de início da proteção (24h)
RaidProtectionTimeStart=22

; Horário de fim da proteção
RaidProtectionTimeEnd=10


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; PVP / PVE
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; Permitir PvP
AllowPVP=false

; Permitir PvE
AllowPVE=true

; Penalidade por morte
; 0.5 = leve
; 1.0 = padrão
; 2.0 = severa
DeathPenaltyMultiplier=1.0


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; ECONOMIA / TRADERS
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; Ativar traders
EnableTraders=true

; Preço de compra no trader
; 0.5 = barato
; 1.0 = padrão
; 2.0 = caro
TraderBuyMultiplier=1.0

; Preço de venda no trader
; 0.5 = vende barato
; 1.0 = padrão
; 2.0 = vende caro
TraderSellMultiplier=1.0

; Tempo de refresh dos traders (minutos)
; Padrão: 60
TraderRefreshTime=60


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; CONTROLE DE JOGADORES
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; Ping máximo permitido (ms)
; 0 = desativa
MaxPing=250

; Kick por ping alto
KickHighPing=true

; Kick por AFK
KickIdlePlayers=true

; Tempo máximo AFK (segundos)
IdleTimeLimit=900


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; LOGS
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; Ativar logs do servidor
EnableServerLogs=true

; Nível de log
; INFO | WARN | ERROR | DEBUG
LogLevel=INFO
