version: "3.9"

services:
  7dtd-server:
    image: vinanrra/7dtd-server:latest
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "${PORT_UDP_MAIN}:26900/udp"
      - "${PORT_TCP_MAIN}:26900/tcp"
      - "${PORT_UDP_1}:26901/udp"
      - "${PORT_UDP_2}:26902/udp"

    volumes:
      - ./data/serverfiles:/home/sdtdserver/serverfiles
      - ./data/saves:/home/sdtdserver/.local/share/7DaysToDie
      - ./data/logs:/home/sdtdserver/log
      - ./data/backups:/home/sdtdserver/lgsm/backup
      - ./data/mods:/home/sdtdserver/serverfiles/Mods
      - ./data/config:/home/sdtdserver/lgsm

    command: ["/bin/bash", "-c", "./sdtdserver start && tail -f /dev/null"]

    healthcheck:
      test: ["CMD", "pgrep", "7DaysToDieServer"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT}
        reservations:
          memory: ${MEMORY_RESERVATION}
